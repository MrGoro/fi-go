name: CI

on:
  pull_request:
    paths:
      - 'projects/**'
      - '.github/workflows/ci.yml'
      - '.github/actions/setup/**'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Lint
        run: npm run lint -w web

      - name: Typecheck
        run: npx tsc -b
        working-directory: projects/web

      - name: Unit & component tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # WIF auth for the report deploy
      pull-requests: write   # sticky report comment
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      # The Realtime Database emulator requires a Java runtime.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E (Firebase emulators + Playwright)
        # Record reviewable videos (moderate slow-motion) for the published report.
        env:
          PW_VIDEO: '1'
          PW_SLOWMO: '600'
        run: npm run e2e

      # Always keep the report as an artifact (fallback download), pass or fail.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: projects/web/playwright-report/
          retention-days: 7

      # Publish the report (videos + traces) to a Firebase Hosting preview channel
      # and link it from the PR. Same-repo PRs only (forks have no secrets), and
      # regardless of test result so a failing run still ships a video.
      - name: Authenticate to Google Cloud
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT_HOSTING }}
          project_id: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}

      - name: Deploy report to Firebase Hosting preview channel
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        id: deploy
        run: |
          RESULT=$(npx firebase hosting:channel:deploy pr-${{ github.event.pull_request.number }} \
            --project ${{ secrets.VITE_FIREBASE_PROJECT_ID }} --config firebase.report.json --json)
          URL=$(echo "$RESULT" | jq -r '.result | to_entries | .[0].value.url')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Find report comment
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: peter-evans/find-comment@v4
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: E2E-Report

      - name: Comment report link
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            🎬 **E2E-Report (Playwright):** [Report öffnen](${{ steps.deploy.outputs.url }})
            Videos (Desktop + Mobile) & Traces für jeden Schritt.
            *Channel läuft in 7 Tagen ab.*

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Lint
        run: npm run lint -w functions

      - name: Typecheck
        run: npm run build -w functions
