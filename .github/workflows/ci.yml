name: CI

on:
  pull_request:
    paths:
      - 'projects/**'
      - '.github/workflows/ci.yml'
      - '.github/actions/setup/**'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Lint
        run: npm run lint -w web

      - name: Typecheck
        run: npx tsc -b
        working-directory: projects/web

      - name: Unit & component tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      # The Realtime Database emulator requires a Java runtime.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E (Firebase emulators + Playwright)
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: projects/web/playwright-report/
          retention-days: 7

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Lint
        run: npm run lint -w functions

      - name: Typecheck
        run: npm run build -w functions
